<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiVideo</title>
  <link rel="stylesheet" href="/styles.css?v=32" />
</head>
<body>
  <aside class="sidebar">
    <button id="new-chat" class="new-chat" type="button">开启新对话</button>
    <div id="history" class="history"></div>
    <div id="model-foot" class="sidebar-foot">DeepSeek V4 Pro · 本机出片</div>
  </aside>
  <main class="main">
    <section id="empty" class="empty" aria-hidden="true"></section>
    <div id="stage-bar" class="stage-bar hidden">
      <div class="stage-switch" role="tablist">
        <button id="view-canvas" class="seg on" type="button">画布</button>
        <button id="view-chat" class="seg" type="button">对话</button>
      </div>
      <div class="stage-zoom">
        <button id="zoom-out" type="button" aria-label="缩小">−</button>
        <button id="zoom-in" type="button" aria-label="放大">+</button>
        <button id="zoom-fit" type="button">适应画面</button>
      </div>
      <div class="stage-controls">
        <button id="pause-run" class="js-pause" type="button">暂停</button>
        <button id="resume-run" class="js-resume" type="button">继续</button>
        <button id="reset-run" class="js-reset" type="button">重置当前步骤</button>
        <span id="save-state" class="save-state"></span>
      </div>
      <button id="dock-toggle" class="dock-toggle" type="button">调试</button>
    </div>
    <div id="work-body" class="work-body">
      <section id="thread" class="thread hidden"></section>
      <div id="canvas-wrap" class="canvas-wrap hidden">
        <div id="canvas" class="canvas">
          <svg id="canvas-edges" class="canvas-edges" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="canvas-nodes"></div>
        </div>
      </div>
      <aside id="debug-dock" class="debug-dock hidden" aria-label="调试">
        <div class="dock-head">
          <b id="dock-phase">阶段</b>
          <span id="dock-percent">0%</span>
          <span id="dock-elapsed" class="dock-elapsed"></span>
        </div>
        <div class="dock-actions">
          <button class="js-pause" type="button">暂停</button>
          <button class="js-resume" type="button">继续</button>
          <button class="js-reset" type="button">重置当前步骤</button>
        </div>
        <p id="dock-message" class="dock-message"></p>
        <h4>任务</h4>
        <ol id="dock-tasks" class="dock-tasks"></ol>
        <h4>事件</h4>
        <ul id="dock-events" class="dock-events"></ul>
        <h4>错误</h4>
        <pre id="dock-error" class="dock-log"></pre>
        <h4>error.log</h4>
        <pre id="dock-error-log" class="dock-log"></pre>
        <h4>render.log</h4>
        <pre id="dock-render-log" class="dock-log"></pre>
        <div id="dock-files" class="dock-files"></div>
      </aside>
    </div>
    <form id="composer" class="composer">
      <div class="composer-main">
        <div id="materials" class="materials hidden">
          <div id="material-list" class="material-list"></div>
          <label class="material-add">
            <input id="material-file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" multiple />
            <span>添加图素材</span>
          </label>
        </div>
        <textarea id="brief" rows="1" placeholder="文字决定要拍成什么样：时长、广告、感觉、情节和结尾。用户没写的部分，用读图补上身份和场景。"></textarea>
        <div class="composer-tools">
          <label class="model-picker">
            <select id="model" aria-label="模型"></select>
          </label>
          <label class="template-picker" title="新建项目使用的模版">
            <select id="template" aria-label="模版">
              <option value="luxury-suv">高奢感 SUV</option>
              <option value="apple-product">Apple 风产品特写</option>
              <option value="drama-product-skill">短剧植入</option>
              <option value="drama-product-skill2">短剧植入 · 导演</option>
            </select>
          </label>
          <label class="soundtrack-picker" title="拼接之后按每镜旁白合成声音">
            <select id="soundtrack" aria-label="声轨">
              <option value="off">声轨：关闭</option>
              <option value="narration">声轨：旁白</option>
            </select>
          </label>
          <label class="debug-toggle" title="写完提示词后只生成图片，不出视频、不拼接">
            <input id="debug-llm" type="checkbox" />
            <span>Debug：仅到生图</span>
          </label>
          <label class="debug-toggle" title="问清意图并写完提示词后停住，不生图">
            <input id="debug-prompt" type="checkbox" />
            <span>Debug：只到提示词</span>
          </label>
          <label class="debug-toggle" title="问清意图后停住，不写提示词，不生图">
            <input id="debug-intent" type="checkbox" />
            <span>Debug：只到意图解析</span>
          </label>
        </div>
      </div>
      <button id="send" type="submit" aria-label="发送">↑</button>
    </form>
  </main>
  <script src="/rpc.js?v=1"></script>
  <script src="/app.js?v=44"></script>
</body>
</html>
