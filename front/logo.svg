<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 48" width="232" height="48" role="img" aria-label="AiVideo 内测">
  <defs>
    <linearGradient id="av-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
  <!-- 胶片框 -->
  <rect x="4" y="8" width="40" height="32" rx="9" fill="url(#av-g)" fill-opacity="0.14" stroke="url(#av-g)" stroke-width="1.6"/>
  <!-- 胶片齿孔 -->
  <g fill="#5b7cfa" fill-opacity="0.55">
    <rect x="8.5" y="13" width="3" height="4" rx="1"/>
    <rect x="8.5" y="22" width="3" height="4" rx="1"/>
    <rect x="8.5" y="31" width="3" height="4" rx="1"/>
    <rect x="36.5" y="13" width="3" height="4" rx="1"/>
    <rect x="36.5" y="22" width="3" height="4" rx="1"/>
    <rect x="36.5" y="31" width="3" height="4" rx="1"/>
  </g>
  <!-- 播放三角 -->
  <path d="M20 16.5 L33.5 24 L20 31.5 Z" fill="url(#av-g)"/>
  <!-- AI 星光 -->
  <path d="M41 4 l1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3 Z" fill="#9b6bff"/>
  <!-- 字标 -->
  <text x="58" y="32" font-family="'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif" font-size="24" font-weight="700" fill="#ece7df">Ai<tspan fill="#8fa3ff">Video</tspan></text>
  <!-- 内测徽章 -->
  <rect x="158" y="13" width="52" height="22" rx="11" fill="#5b7cfa" fill-opacity="0.16" stroke="#6d86ff" stroke-width="1.2"/>
  <text x="184" y="28.5" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="600" fill="#a8b8ff">内测</text>
</svg>