<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>成片时长</title>
  <link rel="stylesheet" href="../styles.css?v=51" />
  <style>
    html, body, .main { height: 100%; }
    .main { min-height: 100vh; background: #0c0c0e; }
    #history, #new-chat { display: none; }
  </style>
</head>
<body>
  <div id="history"></div>
  <button id="new-chat" type="button">新对话</button>
  <main class="main">
    <div id="empty" class="empty hidden"></div>
    <div id="chat-column" class="chat-column">
      <div id="chat-pin" class="chat-pin hidden">
        <div id="chat-progress" class="chat-progress"></div>
        <div id="chat-actions" class="chat-actions"></div>
      </div>
      <section id="thread" class="thread hidden"></section>
      <form id="composer" class="composer">
        <div class="composer-main">
          <textarea id="brief" rows="1" placeholder="文字决定要拍成什么样：时长、广告、感觉、情节和结尾。用户没写的部分，用读图补上身份和场景。"></textarea>
          <div class="composer-actions">
            <button id="send" type="submit" aria-label="发送">↑</button>
          </div>
        </div>
      </form>
    </div>
  </main>
  <script>
    const reply = "先写这支片子的成片时长，单位用秒。没写时长，不能判断要不要段缝。";
    const started = new Date(Date.now() - 21000).toISOString();
    window.__AIVIDEO_FIXTURE__ = {
      capture: true,
      sent: [],
      project: {
        id: "duration-ask",
        title: "成片时长",
        brief: "一支海边的片子",
        status: "drilling",
        stage: "立项锁定",
        can_reply: true,
        script: "",
        storyboard: "",
        image_prompts: "",
        error: null,
        created_at: started,
        started_at: started,
        updated_at: started,
        messages: [
          {
            role: "assistant",
            content: "必须由用户选定。markdown 是正文，看板由它编译。",
            options: ["① 只要离线看板", "② 只要 markdown", "③ 两者都要"],
            choice_kind: "single",
          },
          { role: "user", content: "① 只要离线看板" },
          { role: "assistant", content: reply, options: [], choice_kind: "number" },
        ],
        events: [
          { at: started, message: "正在想方向" },
          { at: started, message: "立项锁定" },
        ],
        tasks: [],
        progress: {
          percent: 0,
          phase: "lock_wait",
          message: reply,
          question: { id: "duration", kind: "number", reply: reply, options: [] },
        },
      },
    };
  </script>
  <script src="../rpc.js?v=2"></script>
  <script src="../app.js?v=81"></script>
</body>
</html>
