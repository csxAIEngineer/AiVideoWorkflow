services:
  aivideo:
    build: .
    image: aivideo:latest
    container_name: aivideo
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
    volumes:
      - aivideo-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aivideo-data:
