services:
  ai:
    build: .
    image: aivideo:latest
    container_name: aivideo-ai
    restart: unless-stopped
    command: ["python", "-m", "Agents.server"]
    env_file:
      - .env
    environment:
      AI_HOST: "0.0.0.0"
      AI_PORT: "8791"
      AIVIDEO_AI_AUTOSTART: "0"
    volumes:
      - aivideo-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8791/rpc', data=b'{\"jsonrpc\":\"2.0\",\"method\":\"ping\",\"id\":1}', headers={'Content-Type':'application/json'}), timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  end:
    build: .
    image: aivideo:latest
    container_name: aivideo
    restart: unless-stopped
    command: ["python", "-m", "end.server"]
    depends_on:
      ai:
        condition: service_healthy
    ports:
      # Loopback only: public access must go through an authenticating reverse
      # proxy (and, once the account system lands, user sessions). The RPC and
      # /media surfaces are not safe to expose anonymously on a public IP.
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      AIVIDEO_AI_URL: "http://ai:8791"
      AIVIDEO_AI_AUTOSTART: "0"
      # Account system: set AIVIDEO_PG_DSN in .env, then flip to log → require.
      AIVIDEO_REQUIRE_AUTH: "${AIVIDEO_REQUIRE_AUTH:-off}"
    volumes:
      - aivideo-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 账户系统主库（决策 A：同机容器）。profile 隔离：
  #   docker compose --profile pg up -d   才启动；本地 nohup/restart.sh 不受影响。
  # end 经 compose 网络以主机名 db 访问；密码只放服务器 .env（AIVIDEO_PG_PASSWORD）。
  db:
    image: postgres:16-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: ${AIVIDEO_PG_PASSWORD:-}
      POSTGRES_DB: aivideo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aivideo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo -d aivideo"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aivideo-data:
  aivideo-pgdata:
