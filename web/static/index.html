<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiVideo</title>
  <link rel="stylesheet" href="/styles.css?v=24" />
</head>
<body>
  <aside class="sidebar">
    <button id="new-chat" class="new-chat" type="button">开启新对话</button>
    <div id="history" class="history"></div>
    <div id="model-foot" class="sidebar-foot">DeepSeek V4 Pro · 本机出片</div>
  </aside>
  <main class="main">
    <section id="empty" class="empty" aria-hidden="true"></section>
    <section id="thread" class="thread hidden"></section>
    <form id="composer" class="composer">
      <div class="composer-main">
        <textarea id="brief" rows="1" placeholder="写下这段片子的背景"></textarea>
        <div class="composer-tools">
          <label class="model-picker">
            <select id="model" aria-label="模型"></select>
          </label>
          <label class="debug-toggle" title="写完剧本后只生成图片，不出视频、不拼接">
            <input id="debug-llm" type="checkbox" />
            <span>Debug：仅到生图</span>
          </label>
        </div>
      </div>
      <button id="send" type="submit" aria-label="发送">↑</button>
    </form>
  </main>
  <script src="/app.js?v=24"></script>
</body>
</html>
